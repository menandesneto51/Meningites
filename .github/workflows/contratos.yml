name: contratos-ops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas numpy pytest
      - name: Contract tests (demo_cloud, V28–V35)
        run: >
          python -m unittest -v
          tests.test_contratos_ops
          tests.test_contratos_v28
          tests.test_contratos_v29
          tests.test_contratos_v30
          tests.test_contratos_v31_v32
          tests.test_contratos_v33
          tests.test_contratos_v34
          tests.test_contratos_v35
      - name: VNext domain and municipal engine tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_vnext_domain_contracts.py tests/test_vnext_municipal_engine.py tests/test_vnext_legacy_aggregator.py
