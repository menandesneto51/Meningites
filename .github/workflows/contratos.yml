name: contratos-ops

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contratos-ops-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas numpy pytest
      - name: Sanitize committed demo package
        run: >
          python -c "from preparar_pacote_cloud_demo import sanitizar_demo_existente;
          print(sanitizar_demo_existente())"
      - name: Contract tests (demo_cloud, V28–V35)
        run: >
          python -m unittest -v
          tests.test_contratos_ops
          tests.test_contratos_v28
          tests.test_contratos_v29
          tests.test_contratos_v30
          tests.test_contratos_v31_v32
          tests.test_contratos_v33
          tests.test_contratos_v34
          tests.test_contratos_v35

  vnext-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas numpy pytest
      - name: VNext contracts and agent tests
        env:
          PYTHONPATH: src
        run: >
          pytest -q
          tests/test_vnext_domain_contracts.py
          tests/test_vnext_municipal_engine.py
          tests/test_vnext_legacy_aggregator.py
          tests/test_vnext_descriptive_aggregator.py
          tests/test_vnext_municipal_cards.py
          tests/test_vnext_executive_agent.py
          tests/test_vnext_operational_agent.py
          tests/test_vnext_rag_adapter.py
          tests/test_vnext_llm_guardrails.py
          tests/test_vnext_agent_query.py
          tests/test_vnext_agent_http.py
          tests/test_vnext_feature_flags.py
          tests/test_vnext_reconciliation.py
          tests/test_vnext_validation_health.py
          tests/test_vnext_validation_evidence.py
          tests/test_vnext_preflight.py
          tests/test_vnext_publisher.py
